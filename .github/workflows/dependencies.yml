{
  "name": "Dependency checks",
  "on": { "push": {}, "pull_request": {}, "workflow_dispatch": {} },
  "permissions": { "contents": "read" },
  "concurrency":
    { "group": "dependency-${{ github.ref }}", "cancel-in-progress": true },
  "jobs":
    {
      "dependency-gate":
        {
          "name": "Dependency gate",
          "runs-on": "ubuntu-latest",
          "timeout-minutes": 30,
          "steps":
            [
              {
                "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
              },
              {
                "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
                "with": { "node-version": "24" },
              },
              {
                "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
                "with": { "bun-version": "1.4.3" },
              },
              { "run": "bun install --frozen-lockfile" },
              { "run": "bun run check" },
              { "run": "docker build --pull -t dependency-hydro ." },
              {
                "name": "Exercise the production image against an isolated database",
                "run": "set -eu\ntrap 'docker logs dependency-hydro 2>/dev/null || true; docker rm -f dependency-hydro dependency-db 2>/dev/null || true; docker network rm dependency-hydro-test 2>/dev/null || true' EXIT\ndocker network create --internal dependency-hydro-test\ndocker run -d --name dependency-db --network dependency-hydro-test --memory 512m -e POSTGRES_USER=fixture -e POSTGRES_PASSWORD=isolated-fixture -e POSTGRES_DB=hydro_update_test postgres:17-alpine\nfor attempt in $(seq 1 40); do docker exec dependency-db pg_isready -U fixture -d hydro_update_test && break; sleep 2; done\ncat > /tmp/hydro-fixture.env <<'ENV'\nDATABASE_URL=postgresql://fixture:isolated-fixture@dependency-db:5432/hydro_update_test\nBETTER_AUTH_SECRET=isolated-hydro-fixture-secret-32-characters\nBETTER_AUTH_URL=http://127.0.0.1:3001\nCORS_ORIGIN=http://127.0.0.1:3000\nDOMAIN=localhost\nRESEND_API_KEY=re_fixture\nGOOGLE_CLIENT_ID=fixture.apps.googleusercontent.com\nGOOGLE_CLIENT_SECRET=fixture\nSTRIPE_SECRET_KEY=sk_test_fixture\nSTRIPE_WEBHOOK_SECRET=whsec_fixture\nSTRIPE_PUBLISHABLE_KEY=pk_test_fixture\nENV\ndocker run -d --name dependency-hydro --network dependency-hydro-test --memory 2g --env-file /tmp/hydro-fixture.env dependency-hydro\nfor attempt in $(seq 1 60); do docker exec dependency-hydro curl -fsS http://127.0.0.1:3001/ && break; sleep 2; done\ndocker exec dependency-hydro bun scripts/dependency-smoke.ts\n",
              },
            ],
        },
      "verified-release-receipt":
        {
          "name": "Verified release receipt",
          "needs": "dependency-gate",
          "if": "(github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch",
          "runs-on": "ubuntu-latest",
          "permissions": { "contents": "write" },
          "env":
            {
              "GH_TOKEN": "${{ github.token }}",
              "GH_REPO": "${{ github.repository }}",
              "COMMIT": "${{ github.sha }}",
            },
          "steps":
            [
              {
                "name": "Record the exact successful default-branch commit",
                "run": "set -eu\ncase \"$COMMIT\" in *[!a-f0-9]*|'') exit 1;; esac\n[ \"${#COMMIT}\" -eq 40 ]\nref=\"homelab-verified-$COMMIT\"\nexisting=$(gh api \"repos/$GH_REPO/git/matching-refs/tags/$ref\" --jq \".[] | select(.ref == \\\"refs/tags/$ref\\\") | .object.sha\")\nif [ \"$existing\" = \"$COMMIT\" ]; then exit 0; fi\n[ -z \"$existing\" ]\ngh api --method POST \"repos/$GH_REPO/git/refs\" -f \"ref=refs/tags/$ref\" -f \"sha=$COMMIT\"\n",
              },
            ],
        },
    },
}
