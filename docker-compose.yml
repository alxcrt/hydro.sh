version: "3.8"
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HYDRO_DEV_DB_PASSWORD:?Set a unique HYDRO_DEV_DB_PASSWORD in the ignored root .env}
      POSTGRES_DB: hydro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
